<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

function fmt(v,d){if(d==null)d=1;return Number.isFinite(v)?v.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function vnDate(s){if(!s)return '';var p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function avg(a){return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:NaN;}

var cache=lsGet(K.cache,{});
var S={lots:cache.lots||{},plots:cache.plots||{},config:cache.config||null,pending:lsGet(K.pending,{}),seq:0,
  db:null,assets:null,downloads:null,mode:'connecting',syncing:false,err:null,photoErr:null,
  view:'lo',lotId:null,lotForm:null,draft:lsGet(K.draft,null),mapLot:'all',mapSel:null,armed:null};
S.draw=lsGet('dtr.draw.v1',null);
Object.keys(S.pending).forEach(function(p){S.seq=Math.max(S.seq,S.pending[p].seq||0);});
var MEM={}; var URLS={};

/* ---------- Kho dữ liệu: bản ghi chờ gửi đè lên dữ liệu máy chủ ---------- */
function coll(kind){
  var out=Object.assign({},S[kind]);
  Object.keys(S.pending).forEach(function(p){
    var i=p.indexOf('/');if(p.slice(0,i)!==kind)return;
    var id=p.slice(i+1),e=S.pending[p];
    if(e.op==='del')delete out[id];else out[id]=e.data;
  });
  return out;
}
function cfg(){var pc=S.pending['config/main'];var c=(pc&&pc.op==='set')?pc.data:S.config;return {f:Object.assign({},SPECIES,(c&&c.f)||{}),ktt:(c&&c.ktt>=100&&c.ktt<=112)?c.ktt:104.5};}
function savePending(){if(!lsSet(K.pending,S.pending))toast('Bộ nhớ máy đầy – hãy kết nối mạng để gửi dữ liệu');}
function saveDraft(){lsSet(K.draft,S.draft);}
function saveCache(){lsSet(K.cache,{lots:S.lots,plots:S.plots,config:S.config});}
function put(path,data){S.pending[path]={op:'set',data:data,seq:++S.seq};savePending();renderSync();flush();}
function del(path){S.pending[path]={op:'del',seq:++S.seq};savePending();renderSync();flush();}

var flushTimer=null;
async function flush(){
  if(!S.db||S.syncing)return;
  S.syncing=true;renderSync();
  try{
    try{await flushPhotos();S.photoErr=null;}catch(e){S.photoErr=(e&&e.code)||'error';}
    var paths=Object.keys(S.pending);
    for(var i=0;i<paths.length;i++){
      var p=paths[i],e=S.pending[p];if(!e)continue;
      try{
        if(e.op==='del')await S.db.doc(p).delete();else await S.db.doc(p).set(e.data);
        if(S.pending[p]&&S.pending[p].seq===e.seq){delete S.pending[p];savePending();}
        S.err=null;
      }catch(err){S.err=(err&&err.code)||'unavailable';break;}
    }
  }finally{S.syncing=false;renderSync();}
}
function pendingCount(){var n=Object.keys(S.pending).length;return n+localPhotoRefs().size;}
function localPhotoRefs(){
  var m=new Map(),pl=coll('plots');
  Object.keys(pl).forEach(function(id){(pl[id].photos||[]).concat(pl[id].phieu||[]).forEach(function(r){if(typeof r==='string'&&r.indexOf('local:')===0)m.set(r.slice(6),id);});});
  return m;
}

/* ---------- Ảnh: nén, lưu tạm trong máy, tải lên khi có mạng ---------- */
var _idb=null;
function idb(){if(_idb)return _idb;_idb=new Promise(function(res,rej){try{var r=indexedDB.open('dtr-photos',1);r.onupgradeneeded=function(){r.result.createObjectStore('p');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});return _idb;}
function tx(mode,fn){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('p',mode),r=fn(t.objectStore('p'));t.oncomplete=function(){res(r&&r.result);};t.onerror=function(){rej(t.error);};});});}
function idbPut(k,v){return tx('readwrite',function(s){return s.put(v,k);});}
function idbGet(k){return tx('readonly',function(s){return s.get(k);});}
function idbDel(k){return tx('readwrite',function(s){return s.delete(k);});}
async function flushPhotos(){
  if(!S.assets)return;
  var refs=localPhotoRefs();
  for(var entry of refs){
    var key=entry[0],pid=entry[1],blob=MEM[key];
    if(!blob){try{blob=await idbGet(key);}catch(e){}}
    if(!blob)continue;
    var r=await S.assets.upload(blob);
    var p=coll('plots')[pid];
    function sw(x){return x==='local:'+key?r.id:x;}
    if(p){S.pending['plots/'+pid]={op:'set',data:Object.assign({},p,{photos:(p.photos||[]).map(sw),phieu:(p.phieu||[]).map(sw)}),seq:++S.seq};savePending();}
    if(S.draft){S.draft.photos=(S.draft.photos||[]).map(sw);S.draft.phieu=(S.draft.phieu||[]).map(sw);saveDraft();}
    delete MEM[key];idbDel(key).catch(function(){});
  }
}
function shrink(file,max){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var m=max||1600,s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    var c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',0.78);};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}
function hydrateImgs(root){
  (root||document).querySelectorAll('img[data-ref]').forEach(function(img){
    var ref=img.getAttribute('data-ref');
    if(ref.indexOf('local:')!==0){img.src='/_blob/'+ref;return;}
    var key=ref.slice(6);
    if(URLS[key]){img.src=URLS[key];return;}
    var b=MEM[key];
    if(b){URLS[key]=URL.createObjectURL(b);img.src=URLS[key];return;}
    idbGet(key).then(function(bl){if(bl){MEM[key]=bl;URLS[key]=URL.createObjectURL(bl);img.src=URLS[key];}}).catch(function(){});
  });
}

/* ---------- Tính toán lâm học ---------- */
function fOf(lot,c){c=c||cfg();return c.f[(lot&&lot.loai)||'Khác']||c.f['Khác']||0.5;}
function treeV(d,h,f){return Math.PI/4*Math.pow(d/100,2)*h*f;}
function plotStats(p,f){
  var T=(p.trees||[]).filter(function(t){return t.d>0;});
  var hs=T.filter(function(t){return t.h>0;}).map(function(t){return t.h;});
  var hM=avg(hs),V=0,G=0,est=0;
  T.forEach(function(t){var h=t.h>0?t.h:hM;if(!(t.h>0))est++;if(Number.isFinite(h))V+=treeV(t.d,h,f);G+=Math.PI/4*Math.pow(t.d/100,2);});
  var ha=(p.dienTich||0)/10000;
  return {n:T.length,d:avg(T.map(function(t){return t.d;})),h:hM,V:V,est:est,Mha:ha?V/ha:NaN,Nha:ha?T.length/ha:NaN,Gha:ha?G/ha:NaN};
}
function plotsOf(lotId,pl){pl=pl||coll('plots');return Object.keys(pl).map(function(id){return Object.assign({id:id},pl[id]);}).filter(function(p){return p.lotId===lotId;}).sort(function(a,b){return (a.so||0)-(b.so||0);});}
function lotStats(lotId,lot,pl,c){
  var f=fOf(lot,c),ps=plotsOf(lotId,pl),st=ps.map(function(p){return plotStats(p,f);}).filter(function(s){return s.n>0;});
  var M=st.map(function(s){return s.Mha;}).filter(Number.isFinite),n=M.length,m=avg(M),sd=NaN,err=NaN;
  if(n>=2){sd=Math.sqrt(M.reduce(function(a,x){return a+(x-m)*(x-m);},0)/(n-1));err=(TT[Math.min(n-2,TT.length-1)]||1.96)*sd/Math.sqrt(n)/m*100;}
  var trees=[];ps.forEach(function(p){(p.trees||[]).forEach(function(t){trees.push(t);});});
  return {plots:ps.length,n:n,Mha:m,err:err,f:f,Nha:avg(st.map(function(s){return s.Nha;}).filter(Number.isFinite)),
    d:avg(trees.filter(function(t){return t.d>0;}).map(function(t){return t.d;})),h:avg(trees.filter(function(t){return t.h>0;}).map(function(t){return t.h;})),
    total:Number.isFinite(m)&&lot&&lot.dienTich>0?m*lot.dienTich:NaN,est:st.reduce(function(a,s){return a+s.est;},0)};
}
function lotsSorted(){var L=coll('lots');return Object.keys(L).map(function(id){return Object.assign({id:id},L[id]);}).sort(function(a,b){return String(a.maLo).localeCompare(String(b.maLo),'vi',{numeric:true});});}

var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2800);}
function renderSync(){
  var el=$('#sync'),n=pendingCount(),off=navigator.onLine===false,cls='sync',txt;
  if(S.mode==='connecting'){txt='Đang kết nối…';}
  else if(S.mode==='sodo'){var ex=lsGet('dtr.exported.v1',null),np=Object.keys(coll('plots')).length,okx=!np||(ex&&ex.plots>=np);txt=np?(okx?'Đã xuất · ':'Chưa xuất · ')+np+' ô':'Lưu trên máy';cls+=okx?' ok':' wait';}
  else if(S.mode==='local'){txt='Lưu trên máy này';cls+=' wait';}
  else if(S.err==='not_granted'||S.err==='revoked'){txt='Chỉ được xem';cls+=' err';}
  else if(S.err&&S.err!=='unavailable'&&n){txt='Lỗi gửi · '+n;cls+=' err';}
  else if(n){txt=(off?'Mất mạng · ':S.syncing?'Đang gửi · ':'Chờ gửi · ')+n;cls+=' wait';}
  else{txt='Đã đồng bộ';cls+=' ok';}
  el.className=cls;el.textContent=txt;
}
function setView(v,keepLot){
  if(VIEWS.indexOf(v)<0)v='lo';
  S.view=v;S.armed=null;if(!keepLot&&v!=='lo')S.lotForm=null;
  try{history.replaceState(null,'','#'+v);}catch(e){}
  document.querySelectorAll('[data-nav]').forEach(function(b){b.toggleAttribute('aria-current',b.getAttribute('data-nav')===v);if(b.getAttribute('data-nav')===v)b.setAttribute('aria-current','page');});
  render();window.scrollTo(0,0);
}
function render(){
  var m=$('#main');
  if(S.view==='lo')m.innerHTML=viewLo();
  else if(S.view==='do')m.innerHTML=viewDo();

  hydrateImgs(m);renderSync();

  if(S.view==='do')updateTally();
}

function gpsNow(){
  if(!navigator.geolocation){showGpsHelp();return;}

  stop();

    if(best)setCoords(best.lat,best.lng,'GPS, sai số ±'+Math.round(best.acc)+' m');else showGpsHelp('Không nhận được tín hiệu GPS sau 25 giây.');}
  try{gpsWatch=navigator.geolocation.watchPosition(function(p){var c=p.coords;
      if(!best||c.accuracy<best.acc)best={lat:c.latitude,lng:c.longitude,acc:c.accuracy};
      var mm=$('#gpsMsg');if(mm)mm.textContent='Đang dò GPS… sai số hiện tại ±'+Math.round(best.acc)+' m';
      if(best.acc<=5||(Date.now()-start>10000&&best.acc<=15))finish();},
    function(err){if(fin)return;if(best){finish();return;}fin=true;stop();clearTimeout(timer);
      showGpsHelp(err&&err.code===1?'Điện thoại hoặc trang không cho phép dùng vị trí.':err&&err.code===2?'Điện thoại chưa bắt được vị trí, kiểm tra đã bật Định vị chưa.':'');},

}
function parseAny(v){
  var s=String(v||'').trim();if(!s)return null;
  var u=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|center|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(?:\+|%20)?(-?\d+\.\d+)/i)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(u)return [+u[1],+u[2]];
  var re=/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′’]\s*([\d.,]+)\s*["″”]?\s*([NSEWnsew])/g,mm,o=[];
  while((mm=re.exec(s))){var val=+mm[1]+(+mm[2])/60+num(mm[3])/3600,hh=mm[4].toUpperCase();if(hh==='S'||hh==='W')val=-val;o.push({v:val,h:hh});}
  if(o.length>=2){var la=o.filter(function(x){return x.h==='N'||x.h==='S';})[0],lo=o.filter(function(x){return x.h==='E'||x.h==='W';})[0];if(la&&lo)return [la.v,lo.v];}
  var dec=s.replace(/[°º]/g,'').replace(/\s*[NE]\b/gi,'').replace(/\s+/g,' ').trim();
  return parsePair(dec);
}

function parsePair(v){
  var s=String(v).trim(),m=s.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/)||s.match(/^(-?\d+(?:[.,]\d+)?)\s*(?:;|\s|,\s)\s*(-?\d+(?:[.,]\d+)?)$/);

/* ---------- Chuyển VN-2000 (TM 3°) sang WGS84 ---------- */
function vn2000ToWgs84(X,Y,lon0Deg){
  var a=6378137,f=1/298.257223563,e2=f*(2-f),k0=0.9999,FE=500000;
  var lon0=lon0Deg*Math.PI/180;
  // TM ngược (Snyder) trên ellipsoid WGS84 – VN-2000 dùng cùng ellipsoid
  var M=X/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));
  var e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  var p1=mu+(3*e1/2-27*Math.pow(e1,3)/32)*Math.sin(2*mu)+(21*e1*e1/16-55*Math.pow(e1,4)/32)*Math.sin(4*mu)+(151*Math.pow(e1,3)/96)*Math.sin(6*mu)+(1097*Math.pow(e1,4)/512)*Math.sin(8*mu);
  var ep2=e2/(1-e2),C1=ep2*Math.cos(p1)*Math.cos(p1),T1=Math.tan(p1)*Math.tan(p1);
  var N1=a/Math.sqrt(1-e2*Math.sin(p1)*Math.sin(p1)),R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)*Math.sin(p1),1.5);
  var D=(Y-FE)/(N1*k0);
  var lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*Math.pow(D,4)/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*Math.pow(D,6)/720);
  var lon=lon0+(D-(1+2*T1+C1)*Math.pow(D,3)/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*Math.pow(D,5)/120)/Math.cos(p1);
  // Địa lý → ECEF (VN-2000)
  var sl=Math.sin(lat),cl=Math.cos(lat),N=a/Math.sqrt(1-e2*sl*sl);
  var x=N*cl*Math.cos(lon),y=N*cl*Math.sin(lon),z=N*(1-e2)*sl;
  // Helmert 7 tham số VN-2000 → WGS84 (QĐ 05/2007/QĐ-BTNMT)
  var as=Math.PI/180/3600,rx=-0.00928836*as,ry=0.01975479*as,rz=-0.00427372*as,s=1+0.252906278e-6;
  var X2=-191.90441429+s*(x-rz*y+ry*z),Y2=-39.30318279+s*(rz*x+y-rx*z),Z2=-111.45032835+s*(-ry*x+rx*y+z);
  // ECEF → địa lý (WGS84)
  var lo=Math.atan2(Y2,X2),pp=Math.sqrt(X2*X2+Y2*Y2),la=Math.atan2(Z2,pp*(1-e2)),h=0;
  for(var i=0;i<8;i++){var Ni=a/Math.sqrt(1-e2*Math.sin(la)*Math.sin(la));h=pp/Math.cos(la)-Ni;la=Math.atan2(Z2,pp*(1-e2*Ni/(Ni+h)));}
  return [la*180/Math.PI,lo*180/Math.PI];
}
function looksVN2000(X,Y){return X>500000&&X<2700000&&Y>150000&&Y<850000;}
function parseKtt(v){var s=String(v||'').trim(),m=s.match(/^(\d{2,3})\s*[°º\s]\s*(\d{1,2})?\s*['′]?\s*$/);if(m)return +m[1]+(m[2]?+m[2]/60:0);var n=num(s);return n>=100&&n<=112?n:NaN;}
function kttTxt(d){var g=Math.floor(d),mi=Math.round((d-g)*60);return g+'°'+String(mi).padStart(2,'0')+"'";}
function convVN(d,silent){
  var X=d.vnX,Y=d.vnY;
  if(!(Number.isFinite(X)&&Number.isFinite(Y))){if(!silent)toast('Nhập đủ X và Y VN-2000');return false;}
  if(!looksVN2000(X,Y)&&looksVN2000(Y,X)){var t=X;X=Y;Y=t;d.vnX=X;d.vnY=Y;if(!silent)toast('Đã đảo X, Y cho đúng: X hướng Bắc, Y hướng Đông');}
  if(!looksVN2000(X,Y)){if(!silent)toast('X, Y không giống VN-2000 (X khoảng 1.000.000, Y khoảng 500.000)');return false;}
  var r=vn2000ToWgs84(X,Y,cfg().ktt);d.lat=+r[0].toFixed(7);d.lng=+r[1].toFixed(7);return true;

  var l=s.toLowerCase();

var RE={c:/(^c\s*1[.,]?3)|chu\s*vi|^c$|^cv\b/,d:/(^d\s*1[.,]?3)|đường\s*kính|duong\s*kinh|^d$/,h:/h\s*vn|chiều\s*cao|chieu\s*cao|^h$|^h\s*\(/,q:/phẩm\s*chất|pham\s*chat|^pc$|^p\.?\s*chất/,stt:/^stt$|^tt$|^số\s*tt$|^stt\s*cây$/,o:/^ô(\s*số)?$|^o\s*so$|^số\s*ô$|^ô\s*tc|^otc(\s*số)?$/};

var HT=[['Rừng trồng','#2E9E4F'],['Đã khai thác','#E0A030'],['Đất trống','#C9B48A'],['Mặt nước, kênh','#3A8FD8'],['Đường, bờ bao','#8A8A8A'],['Khác','#9A7FD1']];
function htColor(n){for(var i=0;i<HT.length;i++)if(HT[i][0]===n)return HT[i][1];return '#9A7FD1';}
function polyArea(pts){if(!pts||pts.length<3)return 0;var R=6378137,r=Math.PI/180,a=0,n=pts.length;
  for(var i=0;i<n;i++){var p1=pts[i],p2=pts[(i+1)%n];a+=(p2[1]-p1[1])*r*(2+Math.sin(p1[0]*r)+Math.sin(p2[0]*r));}
  return Math.abs(a*R*R/2);}
function gdist(a,b){var R=6371008.8,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.pow(Math.sin(dl/2),2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.pow(Math.sin(dn/2),2);return 2*R*Math.asin(Math.sqrt(h));}

function wgs84ToVn2000(lat,lng,lon0Deg){
  var a=6378137,f=1/298.257223563,e2=f*(2-f),k0=0.9999,FE=500000,ep2=e2/(1-e2),r=Math.PI/180;
  var sl=Math.sin(lat*r),cl=Math.cos(lat*r),N=a/Math.sqrt(1-e2*sl*sl);
  var x=N*cl*Math.cos(lng*r),y=N*cl*Math.sin(lng*r),z=N*(1-e2)*sl;
  var as=r/3600,rx=-0.00928836*as,ry=0.01975479*as,rz=-0.00427372*as,s=1+0.252906278e-6;
  var dx=x+191.90441429,dy=y+39.30318279,dz=z+111.45032835;
  var X=(dx+rz*dy-ry*dz)/s,Y=(-rz*dx+dy+rx*dz)/s,Z=(ry*dx-rx*dy+dz)/s;
  var lo=Math.atan2(Y,X),pp=Math.sqrt(X*X+Y*Y),la=Math.atan2(Z,pp*(1-e2)),h=0;
  for(var i=0;i<8;i++){var Ni=a/Math.sqrt(1-e2*Math.sin(la)*Math.sin(la));h=pp/Math.cos(la)-Ni;la=Math.atan2(Z,pp*(1-e2*Ni/(Ni+h)));}
  var Nn=a/Math.sqrt(1-e2*Math.sin(la)*Math.sin(la)),T=Math.pow(Math.tan(la),2),C=ep2*Math.pow(Math.cos(la),2),A=(lo-lon0Deg*r)*Math.cos(la);
  var e4=e2*e2,e6=e4*e2;
  var M=a*((1-e2/4-3*e4/64-5*e6/256)*la-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*la)+(15*e4/256+45*e6/1024)*Math.sin(4*la)-(35*e6/3072)*Math.sin(6*la));
  var E=FE+k0*Nn*(A+(1-T+C)*Math.pow(A,3)/6+(5-18*T+T*T+72*C-58*ep2)*Math.pow(A,5)/120);
  var Nth=k0*(M+Nn*Math.tan(la)*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24+(61-58*T+T*T+600*C-330*ep2)*Math.pow(A,6)/720));
  return [Nth,E];
}

function mapSvg(pts,color,polys){
  var W=640,H=440,P=46;polys=polys||[];
  var allp=pts.map(function(p){return [p.lat,p.lng];});polys.forEach(function(q){allp=allp.concat(q.pts);});
  var la=allp.map(function(p){return p[0];}),lo=allp.map(function(p){return p[1];});
  var a0=Math.min.apply(null,la),a1=Math.max.apply(null,la),o0=Math.min.apply(null,lo),o1=Math.max.apply(null,lo);
  var cA=(a0+a1)/2,cO=(o0+o1)/2,k=Math.cos(cA*Math.PI/180);
  var ys=Math.max(a1-a0,0.002),xs=Math.max((o1-o0)*k,0.002);

  for(var v=Math.ceil(lngMin/st)*st;v<=lngMax;v+=st){var x=X(v);if(x<P/2||x>W-8)continue;g+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+H+'" stroke="var(--line)" stroke-width="1"/><text x="'+(x+3).toFixed(1)+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)" font-family="var(--f-num)">'+v.toFixed(dec)+'°E</text>';}
  for(v=Math.ceil(latMin/st)*st;v<=latMax;v+=st){var y=Y(v);if(y<12||y>H-20)continue;g+='<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="4" y="'+(y-3).toFixed(1)+'" font-size="10" fill="var(--muted)" font-family="var(--f-num)">'+v.toFixed(dec)+'°N</text>';}
  var mpp=111320/sc,cands=[10,20,50,100,200,500,1000,2000,5000,10000,20000],bar=cands[0];
  for(var i=0;i<cands.length;i++)if(cands[i]/mpp<=140)bar=cands[i];
  var bw=bar/mpp;
  g+='<g transform="translate('+(W-bw-16)+','+(18)+')"><rect x="-6" y="-12" width="'+(bw+12)+'" height="26" rx="4" fill="var(--surface)" opacity=".9"/><line x1="0" y1="8" x2="'+bw.toFixed(1)+'" y2="8" stroke="var(--ink)" stroke-width="2"/><line x1="0" y1="3" x2="0" y2="8" stroke="var(--ink)" stroke-width="2"/><line x1="'+bw.toFixed(1)+'" y1="3" x2="'+bw.toFixed(1)+'" y2="8" stroke="var(--ink)" stroke-width="2"/><text x="'+(bw/2).toFixed(1)+'" y="0" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="var(--f-num)">'+(bar>=1000?bar/1000+' km':bar+' m')+'</text></g>';
  g+='<g transform="translate(18,22)"><text x="0" y="0" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">B</text><path d="M0 4 L5 16 L0 13 L-5 16 Z" fill="var(--ink)"/></g>';
  polys.forEach(function(q){g+='<polygon points="'+q.pts.map(function(v){return X(v[1]).toFixed(1)+','+Y(v[0]).toFixed(1);}).join(' ')+'" fill="'+q.c+'" fill-opacity=".35" stroke="'+q.c+'" stroke-width="2"/>';});
  pts.forEach(function(p){var x=X(p.lng),y=Y(p.lat),on=p.id===S.mapSel;
    g+='<g data-act="map-sel" data-id="'+esc(p.id)+'" style="cursor:pointer"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="14" fill="transparent"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(on?9:7)+'" fill="'+color[p.lotId]+'" stroke="var(--surface)" stroke-width="2"/><text x="'+(x+11).toFixed(1)+'" y="'+(y+4).toFixed(1)+'" font-size="11" font-weight="600" fill="var(--ink)">Ô '+esc(p.so)+'</text></g>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sơ đồ vị trí các ô tiêu chuẩn"><rect width="'+W+'" height="'+H+'" fill="var(--sunk)"/>'+g+'</svg>';

function exportGeo(){

async function connect(){
  if(SODO){S.mode='sodo';var sb=$('#sub');if(sb)sb.textContent='Lưu trên điện thoại · tự quét GPS';var br=document.querySelector('.brand');if(br&&br.firstChild)br.firstChild.nodeValue='Sổ đo thực địa';
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}renderSync();softRender();return;}
  var c=window.claude;
  if(!c||!c.use){S.mode='local';renderSync();softRender();return;}
  var r=await Promise.all([c.use('db').catch(function(){return null;}),c.use('assets').catch(function(){return null;}),c.use('downloads').catch(function(){return null;}),c.use('sample').catch(function(){return null;})]);
  S.db=r[0];S.assets=r[1];S.downloads=r[2];S.sample=r[3];
  if(S.sample){try{S.sampleLim=await S.sample.limits();S.sampleImg=!!(S.sampleLim&&S.sampleLim.images);}catch(e){S.sampleImg=false;}if(S.view==='do')render();}
  if(!S.db){S.mode='local';softRender();return;}
  S.mode='online';
  function onErr(err){S.err=(err&&err.code)||'unavailable';renderSync();}
  S.db.collection('lots').onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data();});S.lots=o;saveCache();softRender();},onErr);
  S.db.collection('plots').onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data();});S.plots=o;saveCache();softRender();},onErr);
  S.db.doc('config/main').onSnapshot(function(d){S.config=d.exists?d.data():null;saveCache();softRender();},onErr);
  softRender();flush();
}
